appId: com.nacholopez.ai-review
productName: AI Review
directories:
  output: release
afterPack: build/after-pack.cjs
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: core/target/release/core-sidecar
    to: bin/core-sidecar
  - from: core/target/release/core-launcher
    to: bin/core-launcher
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  category: public.app-category.developer-tools
  icon: icons/icon.icns
  artifactName: "${productName}-${version}-${arch}.${ext}"
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: icons/512x512.png
  category: Development
  syncDesktopName: true
  synopsis: AI code review tool with diff UI, inline comments, and prompt generation
  artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  target:
    - dir
  icon: icons/icon.ico
